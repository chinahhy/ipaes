[program:webui]
command=/usr/bin/python3 /app/webui.py
autostart=true
autorestart=true
priority=20
stdout_logfile=/logs/webui-stdout.log
stderr_logfile=/logs/webui-stderr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=1
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=1
environment=PYTHONUNBUFFERED="1"
